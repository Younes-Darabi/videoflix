<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Account</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            padding: 32px;
            text-align: center;
        }
        .header h1 {
            color: #6c2bd9;
            margin: 0;
            font-size: 32px;
            letter-spacing: 2px;
        }
        .header h1 span {
            color: #6c2bd9;
        }
        .body {
            padding: 40px 32px;
        }
        .body p {
            color: #333333;
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }
        .body a.name {
            color: #6c2bd9;
            text-decoration: none;
        }
        .btn {
            display: inline-block;
            margin: 24px 0;
            padding: 14px 32px;
            background-color: #3b5bdb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
        }
        .footer {
            padding: 20px 32px;
            text-align: left;
        }
        .footer p {
            color: #555555;
            font-size: 14px;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <img src="https://videoflix.younes-darabi.de/logo.svg" alt="Videoflix" height="40">
        </div>

        <div class="body">
            <p>Dear <a class="name" href="#">{{ user.email }}</a>,</p>
            <p>Thank you for registering with <a class="name" href="#">Videoflix</a>. To complete your registration and verify your email address, please click the link below:</p>

            <a href="{{ link }}" class="btn">Activate account</a>

            <p>If you did not create an account with us, please disregard this email.</p>
        </div>

        <div class="footer">
            <p>Best regards,</p>
            <p>Your Videoflix Team.</p>
        </div>

    </div>
</body>
</html>
