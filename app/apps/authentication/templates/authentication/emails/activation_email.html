<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Account</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
    <div style="max-width:600px; margin:40px auto; background-color:#ffffff; border-radius:8px; overflow:hidden;">

        <div style="padding:32px; text-align:center;">
            <img src="cid:logo" alt="Videoflix" height="40">
        </div>

        <div style="padding:40px 32px;">
            <p style="color:#333333; font-size:15px; line-height:1.6; margin:8px 0;">Dear <a href="#" style="color:#6c2bd9; text-decoration:none;">{{ user.email }}</a>,</p>
            <p style="color:#333333; font-size:15px; line-height:1.6; margin:8px 0;">Thank you for registering with <a href="#" style="color:#6c2bd9; text-decoration:none;">Videoflix</a>. To complete your registration and verify your email address, please click the link below:</p>

            <a href="{{ link }}" style="display:inline-block; margin:24px 0; padding:14px 32px; background-color:#3b5bdb; color:#ffffff; text-decoration:none; border-radius:30px; font-size:16px; font-weight:bold;">Activate account</a>

            <p style="color:#333333; font-size:15px; line-height:1.6; margin:8px 0;">If you did not create an account with us, please disregard this email.</p>
        </div>

        <div style="padding:20px 32px;">
            <p style="color:#555555; font-size:14px; margin:4px 0;">Best regards,</p>
            <p style="color:#555555; font-size:14px; margin:4px 0;">Your Videoflix Team.</p>
        </div>

    </div>
</body>
</html>
