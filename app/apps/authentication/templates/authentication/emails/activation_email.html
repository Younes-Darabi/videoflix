<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Your Account</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .header {
            background-color: #1a1a2e;
            padding: 32px;
            text-align: center;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .body {
            padding: 40px 32px;
            text-align: center;
        }
        .body h2 {
            color: #1a1a2e;
            font-size: 20px;
        }
        .body p {
            color: #555555;
            font-size: 15px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin: 24px 0;
            padding: 14px 32px;
            background-color: #e50914;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .footer {
            background-color: #f4f4f4;
            padding: 20px 32px;
            text-align: center;
        }
        .footer p {
            color: #aaaaaa;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>VIDEOFLIX</h1>
        </div>

        <div class="body">
            <h2>Welcome, {{ user.email }}!</h2>
            <p>Thank you for registering. Please activate your account by clicking the button below.</p>
            <p>This link will expire after a short time.</p>

            <a href="{{ link }}" class="btn">Activate Account</a>

            <p>If you did not create an account, please ignore this email.</p>
        </div>

        <div class="footer">
            <p>&copy; 2026 Videoflix. All rights reserved.</p>
        </div>

    </div>
</body>
</html>
